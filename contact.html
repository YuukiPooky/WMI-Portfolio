<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact – Erine Dumez</title>
    <meta
      name="description"
      content="Contactez Erine Dumez pour un projet web, graphique ou une demande professionnelle."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="dist/output.css" />
    <link rel="stylesheet" href="CSS/variables.css" />
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/contact.css" />
    <script src="navigation.js?v=2026-11-19" defer></script>
  </head>

  <body>
    <div class="portfolio-area">
      <picture aria-hidden="true">
        <source
          type="image/webp"
          srcset="Images/General/Vagues-768.webp?v=2026-11-19 768w, Images/General/Vagues-1600.webp?v=2026-11-19 1600w"
          sizes="100vw"
        />
        <img
          class="portfolio-texture"
          src="Images/General/Vagues.png"
          alt=""
          width="1600"
          height="1600"
          fetchpriority="high"
          decoding="async"
        />
      </picture>
      <!-- EN-TÊTE -->
      <header id="haut" class="p-0">
        <div
          class="top-bar center flex-wrap gap-2 rounded-b-3xl bg-gradient-to-r from-[var(--color-brand-gradient-start)] to-[var(--color-brand-gradient-end)] px-[25px] py-[9px] shadow-[0_5px_12px_var(--color-navigation-shadow)] md:justify-between md:gap-4"
        >
          <nav
            class="top-links flex flex-wrap items-center justify-center gap-1 md:flex-1 md:flex-nowrap md:gap-[clamp(0.5rem,1.5vw,1.5rem)]"
            aria-label="Navigation principale"
          >
            <a
              class="rounded px-3 py-2 font-semibold text-white no-underline transition-colors hover:text-[var(--color-portfolio-background-end)] focus-visible:bg-[var(--color-brand-focus-background)]"
              href="index.html"
              >Accueil</a
            >
            <a
              class="rounded px-3 py-2 font-semibold text-white no-underline transition-colors hover:text-[var(--color-portfolio-background-end)] focus-visible:bg-[var(--color-brand-focus-background)]"
              href="cv.html"
              >CV</a
            >
            <span
              class="logo order-first m-0 w-full text-center text-xl font-bold italic text-white md:order-none md:mx-[clamp(1rem,3vw,3rem)] md:w-auto"
              >Erine Dumez</span
            >
            <a
              class="rounded px-3 py-2 font-semibold text-white no-underline transition-colors hover:text-[var(--color-portfolio-background-end)] focus-visible:bg-[var(--color-brand-focus-background)]"
              href="projets.html"
              >Projets</a
            >
            <a
              class="rounded px-3 py-2 font-semibold text-white no-underline transition-colors hover:text-[var(--color-portfolio-background-end)] focus-visible:bg-[var(--color-brand-focus-background)]"
              href="contact.html"
              >Contact</a
            >
          </nav>
        </div>
      </header>

      <section class="portfolio-banner contact-banner" aria-label="Contact">
        <h1 class="text-[3.5rem] font-bold text-black tracking-wide">
          Me contacter
        </h1>
      </section>
    </div>

    <!-- CONTENU PRINCIPAL -->
    <main class="contact-page page-content-panel [&+footer]:mt-0">
      <p class="font-semibold">
        Une question ou une idée de projet ? Envoyez-moi votre message via le
        formulaire ci-dessous ; je vous répondrai dès que possible.
      </p>

      <section class="contact-form-card" aria-labelledby="contact-form-title">
        <h2
          class="contact-form-title text-2xl font-bold tracking-wide"
          id="contact-form-title"
        >
          Formulaire de contact
        </h2>
        <form
          class="formulaire-contact card"
          action="mailto:Erinedumez@hotmail.com"
          method="post"
          enctype="text/plain"
        >
          <!-- NOM -->
          <p>
            <label for="nom">Nom et prénom</label><br />
            <input
              class="w-full rounded-md border border-slate-300 p-2 focus:outline-none focus:ring-2 focus:ring-primaire"
              type="text"
              id="nom"
              name="nom"
              placeholder="Ex : Vincent Vanneste"
              required
            />
          </p>

          <!-- EMAIL -->
          <p>
            <label for="email">Adresse e-mail</label><br />
            <input
              class="w-full rounded-md border border-slate-300 p-2 focus:outline-none focus:ring-2 focus:ring-primaire"
              type="email"
              id="email"
              name="email"
              placeholder="Ex : vincent.vanneste@mail.fr"
              required
            />
          </p>

          <!-- MENU DÉROULANT -->
          <p>
            <label for="sujet">Objet de votre message</label><br />
            <select
              class="w-full rounded-md border border-slate-300 p-2 focus:outline-none focus:ring-2 focus:ring-primaire"
              id="sujet"
              name="sujet"
              required
            >
              <option value="">-- Choisissez un objet --</option>
              <option value="projet-web">Projet de site web</option>
              <option value="projet-graphique">
                Projet de création graphique
              </option>
              <option value="autre">Autre demande</option>
            </select>
          </p>

          <!-- MESSAGE -->
          <p>
            <label for="message">Votre message</label><br />
            <textarea
              class="w-full rounded-md border border-slate-300 p-2 focus:outline-none focus:ring-2 focus:ring-primaire"
              id="message"
              name="message"
              rows="6"
              cols="40"
              placeholder="Écrivez votre message ici..."
              required
            ></textarea>
          </p>

          <!-- BOUTONS -->
          <p>
            <button class="btn" type="submit">Envoyer</button>
            <button class="btn" type="reset">Effacer</button>
          </p>
        </form>
      </section>
    </main>

    <!-- PIED DE PAGE -->
    <footer class="mt-8 bg-gradient-to-r from-[var(--color-brand-gradient-start)] to-[var(--color-brand-gradient-end)] p-6 text-center text-white">
      <address>
        &copy; 2026 <strong>Erine Dumez</strong>. Tous droits réservés.
        <br />
        <a
          class="text-white transition-colors hover:text-[var(--color-portfolio-background-end)]"
          href="#haut"
          >Haut de page</a
        >
      </address>
    </footer>
  </body>
</html>
