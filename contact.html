<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact – Erine Dumez</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="CSS/variables.css" />
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/contact.css" />
  </head>

  <body>
    <div class="portfolio-area">
      <img
        class="portfolio-texture"
        src="Images/Général/Vagues.png"
        alt=""
        aria-hidden="true"
      />
      <!-- EN-TÊTE -->
      <header id="haut" class="bg-slate-900 p-4 text-white shadow-md">
        <section class="top-bar">
          <nav
            class="top-links mx-auto flex max-w-6xl flex-wrap items-center justify-center gap-2 md:justify-between md:gap-6"
            aria-label="Navigation principale"
          >
            <a class="rounded px-3 py-2 font-semibold transition-colors hover:text-blue-400 focus-visible:bg-slate-700" href="index.html">Accueil</a>
            <a class="rounded px-3 py-2 font-semibold transition-colors hover:text-blue-400 focus-visible:bg-slate-700" href="cv.html">CV</a>
            <span class="logo order-first w-full text-center text-xl font-bold italic tracking-wide md:order-none md:w-auto">Erine Dumez</span>
            <a class="rounded px-3 py-2 font-semibold transition-colors hover:text-blue-400 focus-visible:bg-slate-700" href="projets.html">Projets</a>
            <a class="rounded px-3 py-2 font-semibold transition-colors hover:text-blue-400 focus-visible:bg-slate-700" href="contact.html">Contact</a>
          </nav>
        </section>
      </header>

      <section class="portfolio-banner contact-banner" aria-label="Contact">
        <h1 class="text-4xl font-bold tracking-wide text-black">Me contacter</h1>
      </section>
    </div>

    <!-- CONTENU PRINCIPAL -->
    <main class="contact-page page-content-panel">
      <p>
        Une question, une proposition de projet ou une demande de stage ?
        Remplissez le formulaire ci-dessous, je vous répondrai dès que possible.
      </p>

      <section class="contact-form-card" aria-labelledby="contact-form-title">
        <h2 class="contact-form-title text-2xl font-bold tracking-wide" id="contact-form-title">
          Formulaire de contact
        </h2>
        <form
          class="formulaire-contact card"
          action="mailto:Erinedumez@hotmail.com"
          method="post"
          enctype="text/plain"
        >
          <!-- NOM -->
          <p>
            <label for="nom">Nom et prénom</label><br />
            <input
              type="text"
              id="nom"
              name="nom"
              placeholder="Ex : Marie Dupont"
              required
            />
          </p>

          <!-- EMAIL -->
          <p>
            <label for="email">Adresse e-mail</label><br />
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Ex : marie.dupont@mail.fr"
              required
            />
          </p>

          <!-- MENU DÉROULANT -->
          <p>
            <label for="sujet">Objet de votre message</label><br />
            <select id="sujet" name="sujet" required>
              <option value="">-- Choisissez un objet --</option>
              <option value="projet-web">Projet de site web</option>
              <option value="projet-graphique">
                Projet de création graphique
              </option>
              <option value="stage-emploi">Stage ou emploi</option>
              <option value="autre">Autre demande</option>
            </select>
          </p>

          <!-- MESSAGE -->
          <p>
            <label for="message">Votre message</label><br />
            <textarea
              id="message"
              name="message"
              rows="6"
              cols="40"
              placeholder="Écrivez votre message ici..."
              required
            ></textarea>
          </p>

          <!-- BOUTONS -->
          <p>
            <button type="submit">Envoyer</button>
            <button type="reset">Effacer</button>
          </p>
        </form>
      </section>
    </main>

    <!-- PIED DE PAGE -->
    <footer class="bg-slate-900 p-4 text-center text-white">
      <address>
        &copy; 2026 <strong>Erine Dumez</strong>. Tous droits réservés.
        <br />
        <a class="transition-colors hover:text-blue-400" href="#haut">Haut de page</a>
      </address>
    </footer>
  </body>
</html>
